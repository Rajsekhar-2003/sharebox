<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <!-- SEO Tags -->
    <title>ShareBy – Fast Text & File Sharing</title>
    <meta name="description" content="Shareby is a fast, SEO-optimized Flask web app for sharing text notes and uploading files. Secure, simple and beautiful using Bootstrap, with QR code links and expiring files.">
    <meta name="keywords" content="file sharing, text sharing, flask, python, upload, bootstrap, qr code, pastebin">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Open Graph -->
    <meta property="og:title" content="ShareBox – Text & File Sharing">
    <meta property="og:description" content="Share text snippets and files with QR codes and expiring links using this Flask + Bootstrap web app.">
    <meta property="og:type" content="website">

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

    <!-- Allows pages to add custom CSS -->
    {% block head %}{% endblock %}
</head>

<body class="bg-light">

<!-- NAVIGATION BAR -->
<nav class="navbar navbar-expand-lg navbar-light" 
     style="background-color: #FAF7F2; box-shadow: 0 2px 5px rgba(0,0,0,0.05);">


    <div class="container">

        <!-- Brand -->
<a class="navbar-brand fw-bold" style="color: #E86A5F;">
    ShareBy
</a>







        <!-- Mobile toggle button -->
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent"
                aria-controls="navbarContent" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>

        <!-- Collapsible content -->
        <div class="collapse navbar-collapse" id="navbarContent" >

            <!-- Centered Nav Links -->
            <ul class="navbar-nav mx-auto mb-2 mb-lg-0 ">
                <li class="nav-item me-3 ">
                    <a class="nav-link fw-semibold " href="{{ url_for('index') }}">Home</a>
                </li>

                <li class="nav-item me-3">
                    
                    <a class="nav-link fw-semibold" href="{{ url_for('about') }}">About</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link fw-semibold" href="{{ url_for('receiver_home') }}">Receiver</a>
                </li>
            </ul>

            <!-- Right button -->
            <div class="d-flex">
                <a class="btn btn-outline-dark btn-sm" href="{{ url_for('share') }}">New Share</a>
            </div>
        </div>

    </div>
</nav>

<!-- PAGE CONTENT -->
<main class="container py-4">
    {% block content %}{% endblock %}
</main>

<!-- FOOTER -->
<!-- FOOTER -->
<footer class="footer-section text-center py-4 small">
    <div class="container">

        <p class="mb-1">
            <strong>ShareBox</strong> — Fast, Secure & Easy File/Text Sharing
        </p>

        <p class="mb-1">
            Built with ❤️ by <strong>Rajsekhar</strong> using Flask & Bootstrap
        </p>

        <p class="text-muted mb-0">
            © {{ 2024 }} ShareBy • Privacy-Focused • No Login Needed • QR Code Sharing
        </p>

    </div>
</footer>


<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
